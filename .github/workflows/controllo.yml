name: Controllo circolari

# Ogni 10 minuti chiede al server di controllare il feed e inviare le notifiche.
# GitHub può ritardare le esecuzioni di qualche minuto nelle ore di punta.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: controllo-circolari
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chiama check.php
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -H "X-Cron-Token: ${CRON_TOKEN}" \
            "https://www.entratadisicurezza.com/svolta/api/check.php"
          echo
